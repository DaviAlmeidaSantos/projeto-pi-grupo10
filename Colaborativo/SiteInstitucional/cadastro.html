<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="./public/css/login_cadastro.css">
    <link rel="shortcut icon" href="./public/assets/Insu-Logo.png" type="image/x-icon">
</head>

<body>
    <div class="container">
        <div class="content">
            <div class="imagem">
                <img src="./public/assets/Insu-Logo.png" alt="Logo-Insu+">
            </div>
            <h2>Registro</h2>

            <label for="ipt_nome">Nome Completo</label>
            <input type="text" id="ipt_nome" class="input" placeholder="Nome Completo"><br>

            <label for="ipt_email">E-mail</label>
            <input type="text" id="ipt_email" class="input" placeholder="E-mail @gmail"><br>

            <label for="ipt_senha">Senha</label>
            <input type="password" id="ipt_senha" class="input" placeholder="Senha"><br>

            <label for="ipt_senha_confirmacao">Confirmar Senha</label>
            <input type="password" id="ipt_senha_confirmacao" class="input" placeholder="Confirmar Senha"><br><br>

            <button class="button">Criar Conta</button>
            <div class="row">
                <p>Já possui uma conta?</p> <a href="login.html" class="link"> Entrar</a>
                <!-- a tag <a> é um link, e o href é para onde ele redireciona -->
            </div>

        </div>
    </div>
</body>

</html>
