<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">


</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="login.html" aria-label="Página inicial">
                <img width="100px" src="../loginEstatico/img/logo.png">
            </a>
            <nav class="nav" aria-label="Principal">
                <a class="nav-link" href="index.html">Página Inicial</a>
                <a class="nav-link active" href="login.html">Entrar</a>
                <a class="nav-link" href="cadastro.html">Cadastrar</a>
            </nav>
        </div>
    </header>
    <div id="header-placeholder"></div>
    <div class="wrapper">
        <h1>Login</h1>
        <div class="input-box">
            <input id="ipt_email" type="text" placeholder="Email" required>
            <img src="../loginEstatico/img/user-alt-1_svgrepo.com.svg">
        </div>
        <div class="input-box">
            <input id="ipt_password" type="password" placeholder="Password" required>
            <img src="../loginEstatico/img/lock-alt_svgrepo.com.svg">
        </div>
        <button type="button" class="btn" id="btn" onclick="login()">Entrar</button>
        <div class="register-link">
            <p>Não tem uma conta? <a href="../loginEstatico/cadastro.html">Registre-se</a></p>
        </div>
    </div>
    <script>
        let useremail = localStorage.getItem("usuario");
        let userpasswd = localStorage.getItem("senha");
        let user = []
        let password = []
        function login() {
            user.push(useremail)
            password.push(password)
            let senha = ipt_password.value
            let email = ipt_email.value
            if (useremail == email && userpasswd == senha) {
                // redireciona para a tela de confirmação de login
                window.location.href = "login_concluido.html";
            } else {
                alert(`Email ou Senha incorretos!!`)
            }
        }
    </script>

</body>

</html>
