<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calculadora de Canavial</title>
</head>

<body>
	Tamanho do canavial (hectares) <input type="text" id="ipt_tamanho"><br>
	Volume desejado (toneladas) <input type="text" id="ipt_volume"><br>
	Insumo escolhido
	<select id="ipt_insumo">
		<option value="npk">Fertilizante NPK</option>
		<option value="organico">Adubo Orgânico</option>
		<option value="ureia">Ureia</option>
		<option value="superfosfato">Superfosfato</option>
		<option value="foliar">Composto Foliar</option>
	</select><br>
	<button onclick="calcular()">Calcular</button>
	<div id="div_msg"></div>
</body>

<script>
	function calcular() {
		let tamanho = Number(ipt_tamanho.value);
		let volume = Number(ipt_volume.value);
		let insumo = ipt_insumo.value;

		let taxa = 0;
		let nome = "";
		let m1 = 0;
		let m2 = 0;
		let m3 = 0;

		if (insumo == "npk") {
			taxa = 0.28;
			nome = "Fertilizante NPK";
			m1 = 0.4;
			m2 = 1.2;
			m3 = 0.3;
		} else if (insumo == "organico") {
			taxa = 0.20;
			nome = "Adubo Orgânico";
			m1 = 0.5;
			m2 = 1.0;
			m3 = 0.4;
		} else if (insumo == "ureia") {
			taxa = 0.32;
			nome = "Ureia";
			m1 = 0.3;
			m2 = 1.5;
			m3 = 0.2;
		} else if (insumo == "superfosfato") {
			taxa = 0.24;
			nome = "Superfosfato";
			m1 = 0.6;
			m2 = 1.1;
			m3 = 0.3;
		} else if (insumo == "foliar") {
			taxa = 0.22;
			nome = "Composto Foliar";
			m1 = 0.4;
			m2 = 1.3;
			m3 = 0.5;
		}

		let prod1 = taxa * m1 * tamanho;
		let prod2 = taxa * m2 * tamanho;
		let prod3 = taxa * m3 * tamanho;

		let maxFase1 = prod1 * 40;
		let maxFase2 = prod2 * 230;

		let dia = 0;

		if (volume <= maxFase1) {
			dia = volume / prod1;
		} else if (volume <= maxFase1 + maxFase2) {
			let sobra = volume - maxFase1;
			dia = 40 + (sobra / prod2);
		} else {
			let sobra = volume - maxFase1 - maxFase2;
			dia = 270 + (sobra / prod3);
		}

		let parteFracionada = dia % 1;
		if (parteFracionada > 0) {
			dia = (dia - parteFracionada) + 1;
		}

		div_msg.innerHTML = `
			Insumo escolhido: ${nome}<br>
			Tempo estimado para atingir o volume desejado: ${dia} dias<br>
			Taxa de crescimento do insumo em cada fase (toneladas/ha/dia):<br>
			• Brotação (0 a 40 dias): ${(taxa * m1).toFixed(2)} ton/ha/dia<br>
			• Crescimento (41 a 270 dias): ${(taxa * m2).toFixed(2)} ton/ha/dia<br>
			• Maturação (acima de 270 dias): ${(taxa * m3).toFixed(2)} ton/ha/dia
		`;
	}
</script>

</html>
