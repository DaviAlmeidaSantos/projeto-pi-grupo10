<html>
<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insumais - Calculadora de tempo</title>
</head>

<body>
    <h1>TEMPO DE ESPERA: </h1>
    <h2>Volume Pretendido em Toneladas</h2> <input type="number" id="vp">
    <br>
    <h2>Área Disponível em Hectares</h2> <input type="number" id="ad">
    <br>
    <h2>Insumo que será aplicado</h2>
    <select id="insumo">
        <option value="1.5">INSUMO A</option>
        <option value="1.25">INSUMO B</option>
        <option value="1.9">INSUMO C</option>
        <option value="1.10">INSUMO D</option>
        <option value="1.4">INSUMO E</option>
    </select>
    <button onclick="calculadora()">CALCULAR TEMPO MÉDIO</button>
    <div id="exibir"></div>
</body>
<script>
    let tch = 60;
    function calculadora() {
        /* 
    ---------------------------------------
    Declaração de variáveis
    ---------------------------------------
    tch -> Taxa de crescimento padrão sem uso de insumos
    meta -> Volume pretendido
    terreno -> Área disponível
    taxa -> taxa de crescimento maximizada de acordo com o insumo aplicado
    tempoM -> Tempo de crescimento em meses sem o uso de insumo
    n_tempoM -> Tempo de crescimento em meses com o uso de insumo
    n_tempoS -> Temp de crescimento em safra sem o uso de insumo
    aceleramento -> Diferença de tempo com entre o uso e o não uso de insumo
    */

        let meta = Number(vp.value);
        let terreno = Number(ad.value);

        let taxa = Number(insumo.value) * tch;

        let tempoM = (meta * 12) / (terreno * tch);
        let n_tempoM = (meta * 12) / (terreno * (insumo.value * tch));
        let n_tempoS = meta / (terreno * (insumo.value * tch));
        let aceleramento = tempoM - n_tempoM;

// Validação da entrada-----------------------------------------------------------
        if (meta <= 0) {
            exibir.innerHTML = `<b>Insirá uma valor maior que 0!!</b>`;
        }
        if (terreno <= 0){
        exibir.innerHTML = `<b>Insirá uma valor maior que 0!!</b>`;
        }
//--------------------------------------------------------------------------------
        if (meta > 0 && terreno > 0) {
            if (insumo.value == "1.5") {
                exibir.innerHTML = `<br>50% de ganho de produtividade<br>
            tempo médio esperado: <b> ${n_tempoS.toFixed(2)}</b> safras;<br>Sem a aplicação: <b>Com a aplicação${tempoM.toFixed(2)}Meses</b> <br><b>${n_tempoM.toFixed(2)} Meses</b>;
            <br> um aceleramento de: <b>${aceleramento.toFixed(2)} Meses</b>`
            } else if (insumo.value == "1.25") {
                exibir.innerHTML = `<br>25% de ganho de produtividade<br>
            tempo médio esperado: <b> ${n_tempoS.toFixed(2)}</b> safras;<br>Sem a aplicação: <b>Com a aplicação${tempoM.toFixed(2)}Meses</b> <br><b>${n_tempoM.toFixed(2)} Meses</b>;
            <br> um aceleramento de: <b>${aceleramento.toFixed(2)} Meses</b>`
            } else if (insumo.value == "1.9") {
                exibir.innerHTML = `<br>90% de ganho de produtividade<br>
            tempo médio esperado: <b> ${n_tempoS.toFixed(2)}</b> safras;<br>Sem a aplicação: <b>Com a aplicação${tempoM.toFixed(2)}Meses</b> <br><b>${n_tempoM.toFixed(2)} Meses</b>;
            <br> um aceleramento de: <b>${aceleramento.toFixed(2)} Meses</b>`
            } else if (insumo.value == "1.10") {
                exibir.innerHTML = `<br>10% de ganho de produtividade<br>
           tempo médio esperado: <b> ${n_tempoS.toFixed(2)}</b> safras;<br>Sem a aplicação: <b>Com a aplicação${tempoM.toFixed(2)}Meses</b> <br><b>${n_tempoM.toFixed(2)} Meses</b>;
            <br> um aceleramento de: <b>${aceleramento.toFixed(2)} Meses</b>`
            } else if (insumo.value == "1.4") {
                exibir.innerHTML = `<br>40% de ganho de produtividade<br>
            tempo médio esperado: <b> ${n_tempoS.toFixed(2)}</b> safras;<br>Sem a aplicação: <b>Com a aplicação${tempoM.toFixed(2)}Meses</b> <br><b>${n_tempoM.toFixed(2)} Meses</b>;
            <br> um aceleramento de: <b>${aceleramento.toFixed(2)} Meses</b>`

            }
        }
    }

</script>

</html>
