<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="wrapper">

        <h1>Cadastro</h1>

        <div class="input-box">
            <input type="text" placeholder="Nome" required>
          
        </div>
        <div class="input-box">
            <input type="email" placeholder="Email" required>
            <img src="../LoginSprint2/img/user-alt-1_svgrepo.com.svg" alt=""> 
        </div>
        <div class="input-box">
            <input type="password" placeholder="Password" required>
            <img src="../LoginSprint2/img/lock-alt_svgrepo.com.svg" alt=""> 
        </div>

        <button type="submit" class="btn">Cadastrar</button>

        <div class="register-link">
            <p>Já tem uma conta? <a href="../LoginSprint2/login.html">Entrar</a></p>
        </div>



    </div>
    
</body>

</html>
