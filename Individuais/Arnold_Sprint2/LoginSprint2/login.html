<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    

</head>

<body>


    <div class="wrapper">
        <h1>Login</h1>
        <div class="input-box">
            <input id="ipt_email" type="text" placeholder="Email" required>
            <img src="../LoginSprint2/img/user-alt-1_svgrepo.com.svg ">
        </div>
        <div class="input-box">
            <input id="ipt_password" type="password" placeholder="Password" required>
            <img src="../LoginSprint2/img/lock-alt_svgrepo.com.svg" >
        </div>

        <!-- <div class="remember-forget">
            <label for=""><input type="checkbox">Lembre-se de mim</label>
            <a href="#">Esqueci a senha</a>
        </div> -->

        <button type="button" class="btn" id="btn" onclick="login()">Entrar</button>

        <div class="register-link">
            <p>Não tem uma conta? <a href="../LoginSprint2/cadastro.html">Registre-se</a></p>
        </div>

    </div>

<script>
    
    function login(){

        let email = ipt_email.value
        let senha = ipt_password.value

        let emailCorreto = "arnold@gmail.com"
        let senhaCorreto = "12345678"

        if(email == emailCorreto && senha == senhaCorreto){
            // alert("Login Realizado com sucesso!!")
            window.location.href = "dash.html";
        }else{
            alert(`Email ou Senha incorretos!!`)
        }
    }
</script>

</body>

</html>
