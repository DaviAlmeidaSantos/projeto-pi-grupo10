<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonstração</title>
    <link rel="stylesheet" href="dash-demonstracao.css">
    <link rel="shortcut icon" href="imagens/logo-insu-escuro.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="posicao-header-main">

        <header class="header">

            <div class="ola-header">
                <h2>Olá, User!</h2>
                <p>Aqui está um resumo do seu canavial.</p>
            </div>

            <div class="user-header">
                <img src="imagens/user-conta.png" alt="User conta">
                <div class="nome-user-header">
                    <h3>User</h3>
                    <p>Fazenda Boa Vista</p>
                </div>
            </div>

        </header>
        <main class="main">

            <h1>Demonstração</h1>
            <p>Acompanhe a demonstração da API dat-acqui-no em funcionamento</p>

            <div class="posicao-container-grafico">
                <div class="container-grafico">
                    <canvas id="myChart"></canvas>
                </div>
            </div>

        </main>
    </div>
</body>

<script>

    const ctx = document.getElementById('myChart');

    const labels = [
        'Janeiro',
        'Fevereiro',
        'Março',
        'Abril',
        'Maio'
    ];

    const data = {
        labels: labels,
        datasets: [{
            label: 'Crescimento do colmo com insumo X',
            data: [1, 3, 4, 5, 6],
            fill: false,
            borderColor: '#07F9A2',
            tension: 0.1
        }]
    };

    const config = {
        type: 'line',
        data: data
    };

    new Chart(ctx, config);

</script>

</html>
