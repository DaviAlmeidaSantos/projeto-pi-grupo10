<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonstração</title>
    <link rel="stylesheet" href="dash-demonstracao.css">
    <link rel="shortcut icon" href="imagens/Insu-Logo.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="posicao-side-bar-e-header">

        <aside class="side-bar">
            <img src="imagens/Insu-Logo.png" alt="Insu+ LOGO">

            <div class="posicao-side-bar">

                <div class="row-side-bar">
                    <img src="imagens/icone-home.png" alt="">
                    <a href="dash-home.html">VISÃO GERAL</a>
                </div>

                <div class="row-side-bar">
                    <img src="imagens/icone-cana-de-acucar.png" alt="">
                    <a href="">INSUMOS</a>
                </div>

                <div class="row-side-bar">
                    <img src="imagens/icone-demonstracao.png" alt="">
                    <a href="">DEMONSTRAÇÃO</a>
                </div>

                <div class="row-side-bar">
                    <img src="imagens/icone-configuracao.png" alt="">
                    <a href="">CONFIGURAÇÃO</a>
                </div>

                <div class="row-side-bar">
                    <img src="imagens/icone-sair.png" alt="">
                    <a href="">SAIR</a>
                </div>
            </div>
        </aside>

        <div class="posicao-header-main">

            <header class="header">
                <div class="ola-header">
                    <h2>Olá, User!</h2>
                    <p>Aqui está um resumo do seu canavial.</p>
                </div>

                <div class="user-header">
                    <img src="imagens/user-conta.png" alt="User conta">
                    <div class="nome-user-header">
                        <h3>User</h3>
                        <p>Fazenda Boa Vista</p>
                    </div>
                </div>
            </header>
            <main class="main">
                <h1>Demonstração</h1>
                <p>Acompanhe a demonstração da API dat-acqui-no em funcionamento</p>

                <div class="posicao-container-grafico">
                    <div class="container-grafico">
                        <canvas id="myChart"></canvas>
                    </div>
                </div>
            </main>
        </div>
</body>

<script>

    const ctx = document.getElementById('myChart');

    const labels = [
        'Janeiro',
        'Fevereiro',
        'Março',
        'Abril',
        'Maio'
    ];

    const data = {
        labels: labels,
        datasets: [{
            label: 'Crescimento do colmo com insumo X',
            data: [1, 3, 4, 5,5, 6],
            fill: false,
            borderColor: '#07F9A2',
            tension: 0.1
        }]
    };

    const config = {
        type: 'line',
        data: data
    };

    new Chart(ctx, config);

</script>

</html>
